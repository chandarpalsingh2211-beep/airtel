<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bhura Singh Meena - Hostel Expense Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="icon">🏠</div>

            <h1>Bhura Singh Meena</h1>

            <p>Hostel Expense Calculator</p>

            <span>Calculate shared living expenses easily</span>
        </div>


        <div class="calculator">

            <div class="input-group">
                <label>🏠 Hostel / Flat Rent</label>

                <input
                    type="number"
                    id="rent"
                    placeholder="Enter rent amount"
                    min="0"
                    step="0.01">
            </div>


            <div class="input-group">
                <label>🍔 Food Expenses</label>

                <input
                    type="number"
                    id="food"
                    placeholder="Enter food amount"
                    min="0"
                    step="0.01">
            </div>


            <div class="row">

                <div class="input-group">
                    <label>⚡ Electricity Units</label>

                    <input
                        type="number"
                        id="electricity"
                        placeholder="Units"
                        min="0"
                        step="0.01">
                </div>


                <div class="input-group">
                    <label>💰 Charge / Unit</label>

                    <input
                        type="number"
                        id="charge"
                        placeholder="₹ / unit"
                        min="0"
                        step="0.01">
                </div>

            </div>


            <div class="input-group">
                <label>👥 Number of Persons</label>

                <input
                    type="number"
                    id="persons"
                    placeholder="Enter number of persons"
                    min="1"
                    step="1">
            </div>


            <div class="buttons">

                <button
                    class="calculate-btn"
                    onclick="calculate()">
                    Calculate
                </button>

                <button
                    class="clear-btn"
                    onclick="clearData()">
                    Clear
                </button>

            </div>


            <div id="error" class="error"></div>


            <div id="result" class="result">

                <p class="result-title">
                    Amount Per Person
                </p>

                <h2 id="amount">
                    ₹ 0.00
                </h2>


                <div class="details">

                    <div>
                        <span>⚡ Electricity Bill</span>
                        <strong id="electricityBill">
                            ₹ 0.00
                        </strong>
                    </div>


                    <div>
                        <span>💰 Total Expenses</span>
                        <strong id="totalExpenses">
                            ₹ 0.00
                        </strong>
                    </div>

                </div>

            </div>

        </div>


        <footer>
            © 2026 Bhura Singh Meena
            <br>
            Python & Web Calculator Project
        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
